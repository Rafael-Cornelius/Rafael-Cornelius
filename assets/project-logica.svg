    <linearGradient id="accent"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="360" rx="26" fill="url(#bg)"/>
  <text x="38" y="58" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="30" font-weight="800">LÓGICA DIGITAL</text>
  <text x="40" y="86" fill="#fcd34d" font-family="Segoe UI,Arial" font-size="15">arquitetura • decodificadores • displays • flip-flop JK</text>
  <g transform="translate(38 115)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#475569" stroke-width="3"><path d="M0 54h90M0 146h90M210 54h64v46h74M210 146h64v-46M458 100h70"/><path d="M528 100h52" stroke="url(#accent)"/></g>
    <g transform="translate(90 18)" stroke="#38bdf8" stroke-width="3"><path d="M0 0h52a42 42 0 0 1 0 72H0z"/><circle cx="95" cy="36" r="5" fill="#38bdf8"/></g>
    <g transform="translate(90 110)" stroke="#f59e0b" stroke-width="3"><path d="M0 0q52 0 82 36Q52 72 0 72q20-36 0-72z"/><circle cx="94" cy="36" r="5" fill="#f59e0b"/></g>
