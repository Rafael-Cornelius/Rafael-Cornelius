    <linearGradient id="accent"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="720" height="360" rx="26" fill="url(#bg)"/>
