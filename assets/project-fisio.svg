      <g transform="translate(0 50)"><rect width="360" height="38" rx="9" fill="#eff6ff" stroke="#bfdbfe"/><circle cx="22" cy="19" r="10" fill="#60a5fa"/><text x="44" y="17" fill="#1e3a8a" font-size="12" font-weight="700">10:30 · Avaliação</text><text x="44" y="31" fill="#64748b" font-size="9">Primeiro atendimento</text><rect x="292" y="10" width="52" height="18" rx="9" fill="#dbeafe"/><text x="318" y="23" text-anchor="middle" fill="#1d4ed8" font-size="9">NOVO</text></g>
