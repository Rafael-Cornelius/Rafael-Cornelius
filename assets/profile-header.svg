<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rafael Cornelius — Engenharia de Software</title>
  <desc id="desc">Banner animado de perfil com terminal, circuitos e informações profissionais de Rafael Cornelius.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0b1734"/>
      <stop offset="1" stop-color="#062b31"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <circle cx="1040" cy="90" r="230" fill="url(#glow)">
    <animate attributeName="r" values="200;250;200" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="330" r="170" fill="#818cf8" opacity="0.045">
    <animate attributeName="cy" values="330;300;330" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.55" fill="none" stroke="url(#line)" stroke-width="2">
    <path d="M0 74h180l28 28h122">
      <animate attributeName="stroke-dasharray" values="0 400;90 400;0 400" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 286h-150l-30-30H900">
      <animate attributeName="stroke-dasharray" values="0 350;80 350;0 350" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(64 54)" filter="url(#shadow)">
    <rect width="360" height="252" rx="18" fill="#030712" stroke="#334155"/>
    <rect width="360" height="42" rx="18" fill="#172033"/>
    <rect y="24" width="360" height="18" fill="#172033"/>
    <circle cx="26" cy="21" r="6" fill="#fb7185"/>
    <circle cx="48" cy="21" r="6" fill="#fbbf24"/>
    <circle cx="70" cy="21" r="6" fill="#4ade80"/>
    <text x="182" y="27" fill="#94a3b8" font-family="Consolas, monospace" font-size="13" text-anchor="middle">rafael.dev</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="25" y="82" fill="#64748b">01</text>
      <text x="61" y="82" fill="#c4b5fd">const</text>
      <text x="118" y="82" fill="#7dd3fc">rafael</text>
      <text x="183" y="82" fill="#e2e8f0">= {</text>

      <text x="25" y="116" fill="#64748b">02</text>
      <text x="82" y="116" fill="#5eead4">curso:</text>
      <text x="153" y="116" fill="#f8fafc">"Eng. Software",</text>

      <text x="25" y="150" fill="#64748b">03</text>
      <text x="82" y="150" fill="#5eead4">base:</text>
      <text x="143" y="150" fill="#f8fafc">["C", "HTML", "CSS"],</text>

      <text x="25" y="184" fill="#64748b">04</text>
      <text x="82" y="184" fill="#5eead4">agora:</text>
      <text x="154" y="184" fill="#f8fafc">"Python + lógica",</text>

      <text x="25" y="218" fill="#64748b">05</text>
      <text x="61" y="218" fill="#e2e8f0">}</text>
      <rect x="79" y="201" width="9" height="22" rx="2" fill="#5eead4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="485" y="118" fill="#94a3b8" font-size="20" font-weight="600" letter-spacing="5">OLÁ, EU SOU</text>
    <text x="480" y="182" fill="#f8fafc" font-size="62" font-weight="900" letter-spacing="1">RAFAEL CORNELIUS</text>
    <rect x="485" y="202" width="610" height="4" rx="2" fill="url(#line)">
      <animate attributeName="width" values="150;610;150" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="485" y="249" fill="#7dd3fc" font-size="25" font-weight="700">ENGENHARIA DE SOFTWARE</text>
    <text x="485" y="286" fill="#cbd5e1" font-size="20">Lógica • Código • Projetos em evolução</text>
    <text x="485" y="320" fill="#94a3b8" font-size="16">Maringá, Paraná — Brasil</text>
  </g>

  <g transform="translate(1110 62)" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M0 0l-18 16L0 32">
      <animateTransform attributeName="transform" type="translate" values="0 0;-7 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M28 0l18 16-18 16">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M20 -8L7 40" stroke="#818cf8"/>
  </g>
</svg>
